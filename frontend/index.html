<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Financial Calculator | Save to GitHub</title>
  <style>
    /* (same responsive CSS as before – keep it) */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto; }
    body { background: linear-gradient(145deg, #eef2f7 0%, #e0e8f0 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .calculator-card { max-width: 860px; width: 100%; background: rgba(255,255,255,0.98); border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3); overflow: hidden; }
    .card-header { background: #0b2b38; padding: 1.2rem 1.5rem; color: white; }
    .card-header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 8px; }
    .content { padding: 1.5rem; }
    .input-grid { display: flex; flex-direction: column; gap: 1rem; background: #fafcff; padding: 1.2rem; border-radius: 1.5rem; border: 1px solid #e3edf5; }
    @media (min-width: 640px) { .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; } }
    .input-field { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-field input { padding: 0.8rem 1rem; border: 1.5px solid #d4e2ef; border-radius: 1rem; font-size: 1rem; }
    .btn-calc, .btn-save { background: #1c5d7a; border: none; padding: 0.85rem 1.2rem; border-radius: 1.2rem; font-weight: 700; color: white; cursor: pointer; width: 100%; margin-top: 0.25rem; }
    .btn-save { background: #2c7a4d; margin-top: 0.5rem; }
    .btn-save:hover { background: #1e5a3a; }
    .output-section { background: #fff; border-radius: 1.5rem; border: 1px solid #eef3fc; padding: 1rem 0 0.8rem 0; margin-top: 0.5rem; }
    .output-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 0.8rem; padding: 1.2rem; }
    .result-card { background: #fafdff; border-radius: 1.2rem; padding: 0.9rem; border: 1px solid #eaf1f9; }
    .result-value { font-size: 1.5rem; font-weight: 700; color: #0b5e7c; }
    .highlight { background: #eef6fc; border-left: 4px solid #1c7e9c; }
    .info-note { background: #f0f6fa; padding: 0.6rem 1rem; margin: 0 1.2rem 1rem 1.2rem; border-radius: 1rem; font-size: 0.7rem; text-align: center; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e2a3e; color: white; padding: 10px 20px; border-radius: 40px; font-size: 0.9rem; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    footer { font-size: 0.65rem; text-align: center; padding: 0.8rem; border-top: 1px solid #eaf0f6; color: #6c8dae; }
  </style>
</head>
<body>
<div class="calculator-card">
  <div class="card-header">
    <h1>📊 EMI Calculator + GitHub Save</h1>
  </div>
  <div class="content">
    <div class="input-grid">
      <div class="input-field"><label>💰 Principal</label><input type="number" id="principal" value="100000" step="1000"></div>
      <div class="input-field"><label>📈 Monthly ROI (%)</label><input type="number" id="monthlyRoi" value="2.5" step="0.1"></div>
      <div class="input-field"><label>📅 Days</label><input type="number" id="days" value="100" step="1"></div>
      <button class="btn-calc" id="calcBtn">⚡ Calculate (Ceil All)</button>
    </div>

    <div class="output-section">
      <div class="output-title">📋 Results (Ceiling)</div>
      <div class="output-grid">
        <div class="result-card"><div class="result-label">Daily Less Principle</div><div class="result-value" id="dailyLessPrinciple">—</div></div>
        <div class="result-card"><div class="result-label">Daily Interest</div><div class="result-value" id="dailyInterest">—</div></div>
        <div class="result-card"><div class="result-label">Daily EMI</div><div class="result-value" id="dailyEmi">—</div></div>
        <div class="result-card highlight"><div class="result-label">Monthly EMI</div><div class="result-value" id="monthlyEmi">—</div></div>
        <div class="result-card highlight"><div class="result-label">Closure Amount</div><div class="result-value" id="closureAmount">—</div></div>
      </div>
      <button class="btn-save" id="saveBtn">💾 Save Results to GitHub</button>
      <div id="errorMsg" style="padding: 0 1.2rem 0.8rem;"></div>
    </div>
    <footer>* All values are ceiling (Math.ceil). Click Save to store in your GitHub repo via API.</footer>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
  // DOM elements
  const principalInput = document.getElementById('principal');
  const roiInput = document.getElementById('monthlyRoi');
  const daysInput = document.getElementById('days');
  const calcBtn = document.getElementById('calcBtn');
  const saveBtn = document.getElementById('saveBtn');

  const dailyLessSpan = document.getElementById('dailyLessPrinciple');
  const dailyIntSpan = document.getElementById('dailyInterest');
  const dailyEmiSpan = document.getElementById('dailyEmi');
  const monthlyEmiSpan = document.getElementById('monthlyEmi');
  const closureSpan = document.getElementById('closureAmount');
  const errorDiv = document.getElementById('errorMsg');

  // Helper to show toast message
  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.backgroundColor = isError ? '#b91c1c' : '#1e2a3e';
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 3000);
  }

  // Core calculation (ceiling on all final values)
  function calculate() {
    let principal = parseFloat(principalInput.value);
    let roi = parseFloat(roiInput.value);
    let days = parseInt(daysInput.value, 10);

    if (isNaN(principal) || principal <= 0) { showToast('Invalid Principal', true); return false; }
    if (isNaN(roi) || roi < 0) { showToast('Invalid ROI', true); return false; }
    if (isNaN(days) || days <= 0) { showToast('Invalid Days', true); return false; }

    const rawDailyLess = principal / days;
    const rawDailyInt = principal * (roi / 100) / 30;
    const rawDailyEmi = rawDailyLess + rawDailyInt;
    const rawMonthlyEmi = rawDailyEmi * 30;
    const rawClosure = principal + (rawDailyInt * days);

    const ceiledDailyLess = Math.ceil(rawDailyLess);
    const ceiledDailyInt = Math.ceil(rawDailyInt);
    const ceiledDailyEmi = Math.ceil(rawDailyEmi);
    const ceiledMonthlyEmi = Math.ceil(rawMonthlyEmi);
    const ceiledClosure = Math.ceil(rawClosure);

    dailyLessSpan.innerText = ceiledDailyLess.toLocaleString();
    dailyIntSpan.innerText = ceiledDailyInt.toLocaleString();
    dailyEmiSpan.innerText = ceiledDailyEmi.toLocaleString();
    monthlyEmiSpan.innerText = ceiledMonthlyEmi.toLocaleString();
    closureSpan.innerText = ceiledClosure.toLocaleString();

    return {
      principal, monthly_roi: roi, days,
      daily_less_principle: ceiledDailyLess,
      daily_interest: ceiledDailyInt,
      daily_emi: ceiledDailyEmi,
      monthly_emi: ceiledMonthlyEmi,
      closure_amount: ceiledClosure
    };
  }

  // Save to backend Flask API
  async function saveToGitHub() {
    // First ensure we have latest calculation
    const results = calculate();
    if (!results) return;

    // Add timestamp
    results.timestamp = new Date().toISOString();

    // Backend URL – adjust if your Flask runs on different port/host
    const API_URL = 'http://localhost:5000/save-results';

    try {
      showToast('Saving to GitHub...');
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(results)
      });

      const data = await response.json();
      if (response.ok) {
        showToast(`✅ Saved! ${data.message} – ${data.url}`);
        console.log('GitHub URL:', data.url);
      } else {
        showToast(`❌ Error: ${data.error}`, true);
        errorDiv.innerHTML = `<div class="error-msg">⚠️ ${data.error}</div>`;
      }
    } catch (err) {
      console.error(err);
      showToast(`❌ Network error: ${err.message}`, true);
      errorDiv.innerHTML = `<div class="error-msg">⚠️ Cannot reach backend. Is Flask running?<br>${err.message}</div>`;
    }
  }

  // Event listeners
  calcBtn.addEventListener('click', calculate);
  saveBtn.addEventListener('click', saveToGitHub);
  // Allow Enter key on inputs
  [principalInput, roiInput, daysInput].forEach(inp => inp.addEventListener('keypress', (e) => { if(e.key === 'Enter') calculate(); }));

  // Initial calculation
  calculate();
</script>
</body>
</html>
